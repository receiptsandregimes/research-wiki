name: Sync short links to Cloudflare

# shorts.yaml is the source of truth for rcpts.link -> wiki permalinks.
# On change, validate and push the redirect ruleset to the Cloudflare zone.
# Requires repo secrets: CF_API_TOKEN with ACCOUNT-level permission
# "Account Rules and Filters: Edit" + Zone "Zone Read" (redirect rules live in
# account rulesets bound to the zone; a zone-scoped token is rejected).
# Repo variable CF_ACCOUNT_ID = Cloudflare account ID (dashboard right rail).

on:
  push:
    branches: [main]
    paths:
      - shorts.yaml
      - site/shorts/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate + apply
        run: python3 site/shorts/sync.py --apply
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE: ${{ vars.CF_ZONE }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
